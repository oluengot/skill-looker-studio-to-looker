<!--
  Banner de navegación entre páginas (mosaico de texto, fila 0 de cada dashboard).
  - Solo estilos INLINE: Looker elimina los <style> del body_text.
  - Página activa = <span> resaltado SIN enlace; las demás = <a href="/embed/dashboards/<modelo>::<pagina>" target="_self">.
  - overflow:hidden + paddings mínimos para que no aparezca scroll vertical en el mosaico
    (no usar overflow-x:auto: su scrollbar dispara el scroll vertical).
  - Reemplazar <ICONO_SVG_n> por los íconos de la barra de LS (copiados del reporte) o quitar.
  - En el .dashboard.lookml va como body_text: '<...>' (una sola línea; escapar comillas simples como '').
-->
<div style="display:flex;justify-content:center;align-items:flex-end;gap:18px;padding:1px 10px;overflow:hidden;font-family:Roboto,Arial,sans-serif;background:#ffffff;">

  <a href="/embed/dashboards/<modelo>::<pagina_1>" target="_self"
     style="display:flex;flex-direction:column;align-items:center;padding:2px 4px;text-decoration:none;color:#5f6368;font-size:12px;">
    <span style="display:block;width:22px;height:22px;margin-bottom:1px;"><ICONO_SVG_1></span>
    <span style="padding-bottom:2px;">Página 1</span>
  </a>

  <!-- Página ACTIVA (sin enlace) -->
  <span style="display:flex;flex-direction:column;align-items:center;padding:2px 4px;color:#224073;font-size:12px;font-weight:700;">
    <span style="display:block;width:22px;height:22px;margin-bottom:1px;"><ICONO_SVG_2></span>
    <span style="padding-bottom:2px;border-bottom:3px solid #224073;">Página 2</span>
  </span>

  <a href="/embed/dashboards/<modelo>::<pagina_3>" target="_self"
     style="display:flex;flex-direction:column;align-items:center;padding:2px 4px;text-decoration:none;color:#5f6368;font-size:12px;">
    <span style="display:block;width:22px;height:22px;margin-bottom:1px;"><ICONO_SVG_3></span>
    <span style="padding-bottom:2px;">Página 3</span>
  </a>

</div>

<!-- ===== Encabezado (mosaico aparte, fila 2) ===== -->
<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 16px;background:#ffffff;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.12);">
  <img src="<URL_LOGO_AREA>" style="height:104px;" alt="Logo área">
  <div style="display:flex;flex-direction:column;align-items:flex-end;">
    <!-- recorte CSS de márgenes blancos: s=alto/altoContenido; background-size=anchoImg*s; position-y=-margenSup*s -->
    <div style="width:256px;height:85px;background:url('<URL_LOGO_PRODUCTO>') no-repeat;background-size:256px 256px;background-position:0 -85px;"></div>
    <div style="color:#165089;font-size:30px;font-weight:700;white-space:nowrap;"><Nombre de la página></div>
  </div>
</div>

<!-- ===== Barra de sección (mosaico aparte) ===== -->
<div style="background:#224073;border-radius:8px;box-shadow:0 2px 6px rgba(0,0,0,.18);color:#ffffff;font-size:22px;text-align:center;text-shadow:0 1px 2px rgba(0,0,0,.35);min-height:10px;padding:4px 0;">
  <Título de sección>
</div>
